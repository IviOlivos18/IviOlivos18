    <clipPath id="cardclip"><rect x="790" y="50" width="432" height="278" rx="19"/></clipPath>
  </defs>
  <style>
    .glow { animation: breathe 5s ease-in-out infinite; transform-origin: center; }
    .star { animation: twinkle 3.7s ease-in-out infinite alternate; }
    .orbit { animation: drift 6s ease-in-out infinite alternate; }
    .cursor { animation: blink 1.05s steps(1) infinite; }
    @keyframes breathe { 0%,100% { opacity:.72; } 50% { opacity:1; } }
    @keyframes twinkle { from { opacity:.18; } to { opacity:.86; } }
    @keyframes drift { from { transform:translateY(0); } to { transform:translateY(-8px); } }
    @keyframes blink { 50% { opacity:0; } }
  </style>
