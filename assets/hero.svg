  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#080D1C"/><stop offset="58%" stop-color="#11142D"/><stop offset="100%" stop-color="#0A1830"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B69AFF"/><stop offset="55%" stop-color="#A4BFFF"/><stop offset="100%" stop-color="#5FECDF"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151E36" stop-opacity=".97"/><stop offset="100%" stop-color="#10182B" stop-opacity=".93"/></linearGradient>
    <radialGradient id="glowA"><stop stop-color="#7C3AED" stop-opacity=".34"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
