<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="108" viewBox="0 0 1100 108" role="img" aria-labelledby="title desc">
<title id="title">Welcome to Ivi Olivos' GitHub</title>
<desc id="desc">Terminal-style typing animation: Welcome to in purple, followed by Ivi Olivos' GitHub in white, without a window or background.</desc>
<defs>
<clipPath id="first"><rect x="15" y="20" width="0" height="75"><animate attributeName="width" from="0" to="275" dur="1.3s" begin="0s;cycle.end+0.6s" fill="freeze"/></rect></clipPath>
<clipPath id="second"><rect x="305" y="20" width="0" height="75"><animate id="secondtype" attributeName="width" from="0" to="660" dur="2.4s" begin="1.3s;cycle.end+1.9s" fill="freeze"/></rect></clipPath>
</defs>
<g font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="44" font-weight="700">
<text x="15" y="73" fill="#A855F7" clip-path="url(#first)">Welcome to</text>
<text x="305" y="73" fill="#FFFFFF" clip-path="url(#second)">Ivi Olivos' GitHub</text>
</g>
<rect x="15" y="32" width="4" height="48" fill="#D8B4FE"><animate attributeName="x" values="15;290;305;965;965;15" keyTimes="0;.20;.22;.60;.90;1" dur="6.2s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="opacity" values="1;0;1" dur=".7s" repeatCount="indefinite"/></rect>
</svg>