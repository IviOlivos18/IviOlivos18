<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="135" viewBox="0 0 1150 135" role="img" aria-labelledby="title desc">
<title id="title">Hi Ivi De Jesus Olivos Cuevas</title>
<desc id="desc">Terminal-style typing animation on one line. Hi types in purple, followed immediately by Ivi De Jesus Olivos Cuevas in white.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C0B15"/><stop offset="1" stop-color="#19102A"/></linearGradient>
  <clipPath id="hello"><rect x="249" y="49" width="50" height="50"><animate attributeName="width" calcMode="discrete" dur="7s" repeatCount="indefinite" values="0;0;25;50;50" keyTimes="0;0.05;0.1;0.16;1"/></rect></clipPath>
  <clipPath id="name"><rect x="315" y="49" width="582.4" height="50">
    <animate attributeName="width" calcMode="discrete" dur="7s" repeatCount="indefinite" values="0;0;22.4;44.8;67.2;89.6;112;134.4;156.8;179.2;201.6;224;246.4;268.8;291.2;313.6;336;358.4;380.8;403.2;425.6;448;470.4;492.8;515.2;537.6;560;582.4;582.4;582.4" keyTimes="0;0.16;0.179;0.198;0.217;0.236;0.255;0.274;0.293;0.312;0.331;0.35;0.369;0.388;0.407;0.426;0.445;0.464;0.483;0.502;0.521;0.54;0.559;0.578;0.597;0.616;0.635;0.654;0.92;1"/>
  </rect></clipPath>
</defs>
<rect x="1" y="1" width="1148" height="133" rx="13" fill="url(#bg)" stroke="#59368F" stroke-width="1.5"/>
<rect x="2" y="2" width="1146" height="32" rx="12" fill="#231735"/>
<rect x="2" y="23" width="1146" height="11" fill="#231735"/>
<circle cx="21" cy="18" r="5" fill="#8B5CF6"/><circle cx="39" cy="18" r="5" fill="#6745A4"/><circle cx="57" cy="18" r="5" fill="#45305E"/>
<text x="81" y="23" fill="#B7A4C9" font-family="Consolas,monospace" font-size="13">~/IviOlivos18/profile</text>
<text x="222" y="84" fill="#A78BFA" font-family="Consolas,monospace" font-size="38" font-weight="700">&gt;</text>
<g font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="38" font-weight="700">
  <text x="250" y="84" fill="#A855F7" clip-path="url(#hello)">Hi</text>
  <text x="315" y="84" fill="#FFFFFF" clip-path="url(#name)">Ivi De Jesus Olivos Cuevas</text>
</g>
<rect x="251" y="54" width="3" height="39" fill="#BFA0FA">
  <animate attributeName="x" calcMode="discrete" dur="7s" repeatCount="indefinite" values="251;315;337.4;359.8;382.2;404.6;427;449.4;471.8;494.2;516.6;539;561.4;583.8;606.2;628.6;651;673.4;695.8;718.2;740.6;763;785.4;807.8;830.2;852.6;875;897.4;897.4;897.4" keyTimes="0;0.16;0.179;0.198;0.217;0.236;0.255;0.274;0.293;0.312;0.331;0.35;0.369;0.388;0.407;0.426;0.445;0.464;0.483;0.502;0.521;0.54;0.559;0.578;0.597;0.616;0.635;0.654;0.92;1"/>
