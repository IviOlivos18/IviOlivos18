<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="450" viewBox="0 0 1400 450" role="img" aria-labelledby="t d">
<title id="t">Ivi Olivos — software developer — purple neon orbit</title>
<desc id="d">Futuristic dark purple gradient portfolio banner inspired by the violet glowing ring reference image.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#080511"/><stop offset=".42" stop-color="#180c34"/><stop offset=".77" stop-color="#311052"/><stop offset="1" stop-color="#10071d"/>
  </linearGradient>
  <radialGradient id="halo"><stop stop-color="#a04fff" stop-opacity=".42"/><stop offset=".4" stop-color="#772cc7" stop-opacity=".26"/><stop offset=".82" stop-color="#451173" stop-opacity=".10"/><stop offset="1" stop-color="#14081e" stop-opacity="0"/></radialGradient>
  <radialGradient id="hole"><stop stop-color="#0c0616"/><stop offset=".78" stop-color="#170920"/><stop offset="1" stop-color="#240a3b"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#b878ff"/><stop offset=".18" stop-color="#f9efff"/><stop offset=".40" stop-color="#ae57ff"/><stop offset=".66" stop-color="#f4dcff"/><stop offset=".82" stop-color="#bc69ff"/><stop offset="1" stop-color="#a546fa"/>
